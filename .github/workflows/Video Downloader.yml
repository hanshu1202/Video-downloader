name: Extract Viki Video

on:
  workflow_dispatch:
    inputs:
      viki_url:
        description: 'Paste the Viki video URL here'
        required: true
        default: 'https://viki.com'
      video_title:
        description: 'Name for the downloaded file (no spaces)'
        required: true
        default: 'Viki_Video'

jobs:
  download_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Updated yt-dlp & TLS Impersonator
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp[default] curl_ciphersuites

      - name: Run Downloader with Live Progress Tracking
        run: |
          yt-dlp \
            --impersonate "chrome:110" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36" \
            --client-certificate "" \
            --socket-timeout 30 \
            --geo-bypass \
            --newline \
            --progress-delta 2 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "${{ github.event.inputs.video_title }}.%(ext)s" \
            "${{ github.event.inputs.viki_url }}"

      - name: Upload Video File as Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video_title }}-artifact
          path: "${{ github.event.inputs.video_title }}.mp4"
          retention-days: 3

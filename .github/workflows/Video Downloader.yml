name: Extract Viki Video

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  download_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Updated yt-dlp & TLS Impersonator
        run: |
          python3 -m pip install --upgrade pip
          # curl_ciphersuites allows yt-dlp to natively mimic browser TLS handshakes
          python3 -m pip install --upgrade yt-dlp[default] curl_ciphersuites

      - name: Run Downloader with Live Progress Tracking
        env:
          VIKI_URL: "https://viki.com"
        run: |
          yt-dlp \
            --impersonate "chrome:110" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36" \
            --client-certificate "" \
            --socket-timeout 30 \
            --geo-bypass \
            --newline \
            --progress-delta 2 \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "Hotel_Del_Luna_Ep1.%(ext)s" \
            "$VIKI_URL"

      - name: Upload Video File as Artifact
        if: success() # Only uploads if the download step finishes successfully
        uses: actions/upload-artifact@v4
        with:
          name: Hotel-Del-Luna-Episode-1
          path: "Hotel_Del_Luna_Ep1.mp4"
          retention-days: 3 # Keeps the file available for 3 days before cleanup
          
